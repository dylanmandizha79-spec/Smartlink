<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Discover New Rewards & Offers</title>

  <meta name="description"
        content="Discover available rewards, apps, surveys and online offers that may be available in your region.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #172033;
      line-height: 1.6;
    }

    .topbar {
      background: #172b5c;
      color: white;
      text-align: center;
      padding: 10px;
      font-size: 13px;
    }

    .container {
      width: 92%;
      max-width: 720px;
      margin: auto;
    }

    .hero {
      background: linear-gradient(135deg, #173b8f, #2563eb);
      color: white;
      padding: 42px 20px 48px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: #ffd83d;
      color: #16213d;
      font-weight: bold;
      padding: 7px 14px;
      border-radius: 30px;
      font-size: 13px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 34px;
      line-height: 1.15;
      margin-bottom: 17px;
    }

    .hero p {
      font-size: 17px;
      opacity: .95;
      max-width: 600px;
      margin: auto;
    }

    .main {
      padding: 25px 0 50px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.07);
    }

    .card h2 {
      font-size: 23px;
      margin-bottom: 10px;
      color: #172b5c;
    }

    .card p {
      color: #596579;
      margin-bottom: 18px;
    }

    .feature {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 13px 0;
      border-bottom: 1px solid #edf0f5;
    }

    .feature:last-child {
      border-bottom: none;
    }

    .icon {
      width: 38px;
      height: 38px;
      background: #e8efff;
      color: #2563eb;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      flex-shrink: 0;
    }

    .feature strong {
      display: block;
      margin-bottom: 2px;
    }

    .feature span {
      color: #687386;
      font-size: 14px;
    }

    .cta {
      display: block;
      width: 100%;
      background: #ffd21f;
      color: #14213d;
      text-decoration: none;
      text-align: center;
      padding: 17px 20px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 5px 0 #d6ae00;
      transition: .2s;
      margin-top: 16px;
    }

    .cta:hover {
      transform: translateY(2px);
      box-shadow: 0 3px 0 #d6ae00;
    }

    .cta-blue {
      background: #2563eb;
      color: white;
      box-shadow: 0 5px 0 #1749ae;
    }

    .cta-blue:hover {
      box-shadow: 0 3px 0 #1749ae;
    }

    .steps {
      display: grid;
      gap: 12px;
      margin-top: 15px;
    }

    .step {
      background: #f7f9fd;
      padding: 14px;
      border-radius: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .number {
      background: #2563eb;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .ad-box {
      min-height: 90px;
      border: 1px dashed #c7cfdd;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9aa3b2;
      font-size: 12px;
      margin: 20px 0;
      text-align: center;
    }

    .notice {
      background: #fff8dc;
      border-left: 4px solid #ffd21f;
      padding: 14px;
      font-size: 13px;
      color: #625623;
      border-radius: 8px;
      margin-top: 18px;
    }

    .footer {
      text-align: center;
      padding: 25px 15px;
      background: #111827;
      color: #aeb7c7;
      font-size: 12px;
    }

    .footer a {
      color: #dbe5ff;
      text-decoration: none;
      margin: 0 5px;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 29px;
      }

      .hero {
        padding: 35px 17px 40px;
      }

      .card {
        padding: 21px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    ✨ Explore available online offers and rewards
  </div>

  <section class="hero">
    <div class="container">

      <div class="badge">
